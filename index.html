<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>AI Note Taker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 8px;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
      transition: 0.2s;
    }
    .btn-record {
      background: #2563eb;
      color: white;
    }
    .btn-record:active { background: #1d4ed8; }
    .btn-stop {
      background: #dc2626;
      color: white;
      display: none;
    }
    .btn-stop:active { background: #b91c1c; }
    .status {
      text-align: center;
      margin: 16px 0;
      font-size: 0.95rem;
      color: #94a3b8;
      min-height: 24px;
    }
    .recording .status {
      color: #f87171;
      font-weight: 600;
    }
    #result {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      white-space: pre-wrap;
      font-size: 0.95rem;
      line-height: 1.5;
      max-height: 300px;
      overflow-y: auto;
      display: none;
    }
    .timer {
      font-size: 1.8rem;
      font-weight: 700;
      text-align: center;
      margin: 12px 0;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>AI Note Taker</h1>
    <div class="subtitle">Tap Record → Speak → Stop → Get transcript</div>

    <div class="timer" id="timer">00:00</div>
    <div class="status" id="status">Ready to record</div>

    <button class="btn btn-record" id="recordBtn" onclick="startRecording()">🎤 Start Recording</button>
    <button class="btn btn-stop" id="stopBtn" onclick="stopRecording()">⏹ Stop Recording</button>

    <div id="result"></div>
  </div>

  <script>
    // ========== PASTE YOUR GEMINI API KEY HERE ==========
    const GEMINI_API_KEY = "AQ.Ab8RN6JzC3iRRrLtfASLR0HkAekp2vYj6OgEWniC7GMrqUFIUg";
    // ====================================================

    let mediaRecorder;
    let audioChunks = [];
    let startTime;
    let timerInterval;

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = processAudio;

        mediaRecorder.start();
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 200);

        document.getElementById("recordBtn").style.display = "none";
        document.getElementById("stopBtn").style.display = "block";
        document.getElementById("status").textContent = "Recording... Speak now";
        document.body.classList.add("recording");
        document.getElementById("result").style.display = "none";
      } catch (err) {
        document.getElementById("status").textContent = "Microphone error: " + err.message;
        alert("Cannot access microphone.\n\nPlease allow microphone permission and try again.");
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
      }
      clearInterval(timerInterval);
      document.getElementById("recordBtn").style.display = "block";
      document.getElementById("stopBtn").style.display = "none";
      document.getElementById("status").textContent = "Processing with Gemini...";
      document.body.classList.remove("recording");
    }

    function updateTimer() {
      const seconds = Math.floor((Date.now() - startTime) / 1000);
      const m = String(Math.floor(seconds / 60)).padStart(2, "0");
      const s = String(seconds % 60).padStart(2, "0");
      document.getElementById("timer").textContent = `${m}:${s}`;
    }

    async function processAudio() {
      const blob = new Blob(audioChunks, { type: "audio/webm" });
      const reader = new FileReader();
      reader.readAsDataURL(blob);
      reader.onloadend = async () => {
        const base64Audio = reader.result.split(",")[1];

        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{
                  parts: [
                    { text: "Please transcribe this audio recording accurately. Only return the transcription text, nothing else." },
                    {
                      inline_data: {
                        mime_type: "audio/webm",
                        data: base64Audio
                      }
                    }
                  ]
                }]
              })
            }
          );

          const data = await response.json();

          if (data.candidates && data.candidates[0].content.parts[0].text) {
            const transcript = data.candidates[0].content.parts[0].text;
            document.getElementById("result").style.display = "block";
            document.getElementById("result").textContent = transcript;
            document.getElementById("status").textContent = "Done!";
          } else {
            throw new Error(data.error?.message || "No transcription returned");
          }
        } catch (err) {
          document.getElementById("status").textContent = "Error: " + err.message;
          document.getElementById("result").style.display = "block";
          document.getElementById("result").textContent = "Failed to process audio.\n" + err.message;
        }
      };
    }
  </script>
</body>
</html>
