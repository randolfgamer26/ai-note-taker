<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Note Taker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin: 0 0 6px; font-weight: 800; }
    .subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 24px; }
    .timer { font-size: 2.8rem; font-weight: 800; margin: 10px 0 16px; font-variant-numeric: tabular-nums; }
    .status { font-size: 1rem; color: #94a3b8; margin-bottom: 20px; min-height: 24px; }
    .recording .status { color: #f87171; font-weight: 700; }
    .btn {
      display: block; width: 100%; padding: 16px; border: none; border-radius: 14px;
      font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-bottom: 12px;
    }
    .btn-record { background: #2563eb; color: white; }
    .btn-stop { background: #dc2626; color: white; display: none; }
    .btn-open { background: #059669; color: white; display: none; text-decoration: none; }
    #transcriptBox {
      background: #0f172a; border-radius: 12px; padding: 16px; margin-top: 16px;
      text-align: left; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.5;
      max-height: 260px; overflow-y: auto; display: none;
    }
    .pulse {
      display: inline-block; width: 10px; height: 10px; background: #f87171;
      border-radius: 50%; margin-right: 8px; animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  </style>
</head>
<body>
  <div class="card">
    <h1>AI Note Taker</h1>
    <div class="subtitle">Record → Stop → Auto Transcript + Save to Drive</div>

    <div class="timer" id="timer">00:00</div>
    <div class="status" id="status">Ready to record</div>

    <button class="btn btn-record" id="recordBtn" onclick="startRecording()">🎤 Start Recording</button>
    <button class="btn btn-stop" id="stopBtn" onclick="stopRecording()">⏹ Stop Recording</button>
    <a class="btn btn-open" id="openDocBtn" href="#" target="_blank">📄 Open Google Doc</a>

    <div id="transcriptBox"></div>
  </div>

  <script>
    // ========== YOUR EMS WEB APP URL ==========
    const EMS_URL = "https://script.google.com/macros/s/AKfycbyLibEpHkypng2g-YbCFoqPfTsLKXBj6yDM8hjY1BfObqjwSql6fiJGtB24pZilo0-E/exec";
    // ==========================================

    let mediaRecorder, audioChunks = [], startTime, timerInterval;

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = sendToEMS;

        mediaRecorder.start();
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 200);

        document.getElementById("recordBtn").style.display = "none";
        document.getElementById("stopBtn").style.display = "block";
        document.getElementById("openDocBtn").style.display = "none";
        document.getElementById("transcriptBox").style.display = "none";
        document.getElementById("status").innerHTML = '<span class="pulse"></span> Recording...';
        document.body.classList.add("recording");
      } catch (err) {
        document.getElementById("status").textContent = "Microphone error: " + err.message;
        alert("Please allow microphone permission.");
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
      }
      clearInterval(timerInterval);
      document.getElementById("recordBtn").style.display = "block";
      document.getElementById("stopBtn").style.display = "none";
      document.getElementById("status").textContent = "Uploading & Transcribing... Please wait";
      document.body.classList.remove("recording");
    }

    function updateTimer() {
      const sec = Math.floor((Date.now() - startTime) / 1000);
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      document.getElementById("timer").textContent = `${m}:${s}`;
    }

    async function sendToEMS() {
      const blob = new Blob(audioChunks, { type: "audio/webm" });
      const reader = new FileReader();
      reader.readAsDataURL(blob);

      reader.onloadend = async () => {
        const base64Audio = reader.result.split(",")[1];

        try {
          const response = await fetch(EMS_URL, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
              action: "aiNoteTaker",
              audio: base64Audio,
              mimeType: "audio/webm"
            }),
            redirect: "follow"
          });

          const text = await response.text();
          let result;
          try {
            result = JSON.parse(text);
          } catch (e) {
            throw new Error("Invalid response from server: " + text.substring(0, 200));
          }

          if (result.success) {
            document.getElementById("status").textContent = "Done!";
            document.getElementById("transcriptBox").style.display = "block";
            document.getElementById("transcriptBox").textContent = result.transcript;

            if (result.docUrl) {
              document.getElementById("openDocBtn").style.display = "block";
              document.getElementById("openDocBtn").href = result.docUrl;
            }
          } else {
            throw new Error(result.message || "Unknown error from server");
          }
        } catch (err) {
          document.getElementById("status").textContent = "Error occurred";
          document.getElementById("transcriptBox").style.display = "block";
          document.getElementById("transcriptBox").textContent = "Failed: " + err.message;
          console.error(err);
        }
      };
    }
  </script>
</body>
</html>
