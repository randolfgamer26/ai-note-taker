<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Note Taker - Recorder</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 6px;
      font-weight: 800;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }
    .timer {
      font-size: 3rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      margin: 10px 0 20px;
      letter-spacing: 2px;
    }
    .status {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 24px;
      min-height: 24px;
    }
    .recording .status {
      color: #f87171;
      font-weight: 700;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 14px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
      transition: transform 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-record {
      background: #2563eb;
      color: white;
    }
    .btn-stop {
      background: #dc2626;
      color: white;
      display: none;
    }
    .btn-download {
      background: #059669;
      color: white;
      display: none;
    }
    .pulse {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: #f87171;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>AI Note Taker</h1>
    <div class="subtitle">Record your voice note</div>

    <div class="timer" id="timer">00:00</div>
    <div class="status" id="status">Ready to record</div>

    <button class="btn btn-record" id="recordBtn" onclick="startRecording()">
      🎤 Start Recording
    </button>

    <button class="btn btn-stop" id="stopBtn" onclick="stopRecording()">
      ⏹ Stop Recording
    </button>

    <button class="btn btn-download" id="downloadBtn" onclick="downloadAudio()">
      ⬇️ Download Recording
    </button>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let audioBlob = null;
    let startTime;
    let timerInterval;

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            echoCancellation: true,
            noiseSuppression: true
          } 
        });

        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          audioBlob = new Blob(audioChunks, { type: "audio/webm" });
          document.getElementById("downloadBtn").style.display = "block";
          document.getElementById("status").textContent = "Recording finished! You can download it.";
        };

        mediaRecorder.start();
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 200);

        // UI changes
        document.getElementById("recordBtn").style.display = "none";
        document.getElementById("stopBtn").style.display = "block";
        document.getElementById("downloadBtn").style.display = "none";
        document.getElementById("status").innerHTML = '<span class="pulse"></span> Recording... Speak now';
        document.body.classList.add("recording");

      } catch (err) {
        document.getElementById("status").textContent = "Error: " + err.message;
        alert("Cannot access microphone.\n\nPlease allow microphone permission and try again.");
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
      }
      clearInterval(timerInterval);

      document.getElementById("recordBtn").style.display = "block";
      document.getElementById("stopBtn").style.display = "none";
      document.body.classList.remove("recording");
    }

    function updateTimer() {
      const totalSeconds = Math.floor((Date.now() - startTime) / 1000);
      const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      document.getElementById("timer").textContent = `${minutes}:${seconds}`;
    }

    function downloadAudio() {
      if (!audioBlob) return;
      const url = URL.createObjectURL(audioBlob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "AI-Note-" + new Date().toISOString().slice(0,19).replace(/:/g,"-") + ".webm";
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
